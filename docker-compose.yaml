services:
  database:
    # build: ../postgres_container
    image: postgres:17-alpine
    volumes: 
      - ./postgres_container/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
      -  db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file:
      - ./src/.env.secrets

  pgadmin:
    image: dpage/pgadmin4:9.8
    ports:
      - 5050:80
    env_file:
      - ./src/.env.secrets
    environment:
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret

      # Don't require the user to login
      PGADMIN_CONFIG_SERVER_MODE: 'False'

      # Don't require a "master" password after logging in
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
  http-server-1:
    build: ./src
    depends_on: 
      - database
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000\")'"]
      interval: 5s
      retries: 10
      start_period: 4s
      
  http-server-2:
    build: ./src
    depends_on: 
      - database
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000\")'"]
      interval: 5s
      retries: 10
      start_period: 4s
  proxy:
    image: haproxy:3.4.4
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8080:8000"
      - "8404:8404"
    depends_on:
      http-server-1:
      # ждём статуса healthy от обоих серверов
        condition: service_healthy
      http-server-2:
        condition: service_healthy
  etcd-1:
    image: quay.io/coreos/etcd:v3.7.1
    volumes:
      - etcd1_data:/etcd-data
    ports:
      - "12371:2379"
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --name
      - etcd-1
      - --initial-advertise-peer-urls
      - http://etcd-1:2380
      - --listen-peer-urls
      - http://0.0.0.0:2380
      - --advertise-client-urls
      - http://localhost:12371
      - --listen-client-urls
      - http://0.0.0.0:2379
      - --initial-cluster
      - etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state
      - new

  etcd-2:
    image: quay.io/coreos/etcd:v3.7.1
    volumes:
      - etcd2_data:/etcd-data
    ports:
      - "12372:2379"
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --name
      - etcd-2
      - --initial-advertise-peer-urls
      - http://etcd-2:2380
      - --listen-peer-urls
      - http://0.0.0.0:2380
      - --advertise-client-urls
      - http://localhost:12372
      - --listen-client-urls
      - http://0.0.0.0:2379
      - --initial-cluster
      - etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state
      - new

  etcd-3:
    image: quay.io/coreos/etcd:v3.7.1
    volumes:
      - etcd3_data:/etcd-data
    ports:
      - "12373:2379"
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --name
      - etcd-3
      - --initial-advertise-peer-urls
      - http://etcd-3:2380
      - --listen-peer-urls
      - http://0.0.0.0:2380
      - --advertise-client-urls
      - http://localhost:12373
      - --listen-client-urls
      - http://0.0.0.0:2379
      - --initial-cluster
      - etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
      - --initial-cluster-state
      - new

volumes:
  db_data:
  etcd1_data:
  etcd2_data:
  etcd3_data: