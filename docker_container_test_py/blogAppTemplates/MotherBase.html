<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>My Website</title>
  <link rel="stylesheet" href="../css/style.css">
  <!-- <link rel="icon" href="./favicon.ico" type="image/x-icon"> -->
</head>

<body>
  <header>
    <h1>Dar's Blog</h1>
  </header>
  <main>
    
    <div id="blog_blocks" class="blogChoice">
      {% for item in blog_block_list %}
      <div class="blogBlock">
        <h1>{{ item.header }}</h1>
        <p>{{ item.text }}</p>
      </div>
      {% endfor %}
    </div>
  </main>
  <footer></footer>
</body>

</html>
