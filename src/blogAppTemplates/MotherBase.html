<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>My Website</title>
  <link rel="stylesheet" href="../css/style.css">
  <!-- <link rel="icon" href="./favicon.ico" type="image/x-icon"> -->
</head>

<body>
  <header>
    <h1>Dar's Blog</h1>
  </header>
  <main>
    <!-- <ul class="menuMain">
      {% for menu_object in menu_list %}
        <li class="menuBlock"><a href="{{ url_for('main') }}">{{menu_object.name}}</li>
      {% endfor %}
    </ul> -->
    <div id="blog_blocks" class="blogChoice">
      {% for item in blog_block_list %}
      <div class="blogBlock">
        <h1>{{ item.header }}</h1>
        <p>{{ item.text }}</p>
      </div>
      {% endfor %}
    </div>
    <div id="imageOfTheDay">
      {% block image_day_block %}
    {% if potd_pre_rendered %}
      {{ potd_pre_rendered | safe }}
    {% elif imageoftheday %}
      {% include imageoftheday %}
    {% endif %}
  {% endblock %}
    </div>
  </main>
  <footer></footer>
</body>

</html>
