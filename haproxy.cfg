global
    log stdout format raw local0

defaults
    log     global
    mode    http
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend main_front
    # Порт 8000 внутри контейнера, который слушает HAProxy
    bind *:8000
    default_backend web_servers

backend web_servers
    balance roundrobin
    # Docker Compose автоматически свяжет эти имена с IP-адресами контейнеров
    server server1 http-server-1:8000 check
    server server2 http-server-2:8000 check
