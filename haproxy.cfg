global
    log stdout format raw local0

defaults
    log     global
    mode    http
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend main_front
    bind *:8000
    default_backend web_servers

backend web_servers
    balance leastconn
    server server1 http-server-1:8000 check
    server server2 http-server-2:8000 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
